<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Recepción de agencia — Seguros Castaño</title>
<style>
  :root { --bg:#F7F4EF; --surface:#FFFFFF; --primary:#7F5539; --deep:#65422B; --accent:#EDE0D4; --text:#2B1E16; --muted:#7D6B5D; --faint:#9A8877; --secondary:#B08968; }
  * { box-sizing:border-box; margin:0; }
  body { width:1440px; height:900px; overflow:hidden; background:var(--bg); font-family:"SoDo Sans",Inter,Manrope,"Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--text); display:flex; flex-direction:column; }
  .cartel { flex:none; height:240px; background:linear-gradient(135deg,#7F5539 0%,#65422B 60%,#4A3525 100%); color:#F7F4EF; display:flex; align-items:center; padding:0 120px; gap:24px; box-shadow:inset 0 1px 0 rgba(255,255,255,.18); }
  .insignia { width:88px; height:88px; border-radius:16px; background:linear-gradient(135deg,#B08968,#7F5539); border:1px solid rgba(255,255,255,.35); display:grid; place-items:center; }
  .insignia svg { width:48px; height:48px; }
  .cartel h1 { font-size:56px; font-weight:700; letter-spacing:-.02em; line-height:1.05; }
  .cartel p { margin-top:8px; font-size:24px; letter-spacing:.3em; text-transform:uppercase; color:rgba(247,244,239,.78); }
  .cuerpo { flex:1; display:grid; place-items:center; position:relative; }
  .orb { position:absolute; border-radius:50%; filter:blur(110px); pointer-events:none; }
  .orb-a { top:-80px; right:140px; width:420px; height:420px; background:radial-gradient(circle,#B08968,transparent 70%); opacity:.35; }
  .mostrador { position:relative; width:560px; background:var(--surface); border:1px solid var(--accent); border-radius:16px; box-shadow:0 2px 8px rgba(43,30,22,.08); padding:48px 52px 40px; }
  .mostrador h2 { font-size:30px; font-weight:600; }
  .mostrador .sub { margin-top:6px; font-size:22px; color:var(--muted); }
  .campo { margin-top:26px; }
  .campo label { display:block; font-size:22px; font-weight:600; margin-bottom:8px; }
  .campo input { width:100%; height:54px; padding:0 16px; border:1px solid var(--secondary); border-radius:12px; font:inherit; font-size:24px; }
  .campo input::placeholder { color:var(--faint); }
  .btn { margin-top:30px; width:100%; height:54px; border:0; border-radius:12px; background:var(--primary); color:#fff; font:inherit; font-size:24px; font-weight:600; }
  .horario { margin-top:22px; display:flex; align-items:center; gap:12px; padding:14px 16px; background:#FCFAF7; border:1px solid var(--accent); border-radius:12px; font-size:22px; color:var(--muted); }
  .horario strong { color:var(--text); }
  .punto { flex:none; width:12px; height:12px; border-radius:50%; background:#00704A; }
  .ayuda { margin-top:16px; font-size:22px; color:var(--muted); text-align:center; }
  .ayuda strong { color:var(--text); }
  .pie { flex:none; padding:20px; text-align:center; font-size:22px; color:var(--faint); }
</style>
</head>
<body>
  <header class="cartel">
    <div class="insignia" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F7F4EF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 6v5c0 4.6-2.8 8-7 10-4.2-2-7-5.4-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <div>
      <h1>Seguros Castaño</h1>
      <p>Panel de Atención</p>
    </div>
  </header>
  <main class="cuerpo">
    <div class="orb orb-a"></div>
    <div class="mostrador">
      <h2>Ingresá al panel</h2>
      <p class="sub">Mostrador de operadores y administración</p>
      <div class="campo"><label for="u">Usuario</label><input id="u" placeholder="Ingresá tu usuario"></div>
      <div class="campo"><label for="c">Contraseña</label><input id="c" type="password" placeholder="Ingresá tu contraseña"></div>
      <button class="btn">Ingresar al Panel</button>
      <div class="horario"><span class="punto" aria-hidden="true"></span><span>Asistente disponible siempre · <strong>Equipo humano L-V 9 a 18</strong></span></div>
      <p class="ayuda">Usuarios de prueba: <strong>admin</strong> u <strong>operador</strong> · Clave: <strong>1234</strong></p>
    </div>
  </main>
  <footer class="pie">© 2026 Seguros Castaño</footer>
</body>
</html>
