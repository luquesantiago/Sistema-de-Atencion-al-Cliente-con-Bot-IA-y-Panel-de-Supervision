name: seguros-castano

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Sin TZ a propósito: MySQL corre en UTC, igual que las fechas que escribe
      # Prisma. La hora argentina se usa solo para mostrar (decisión 21/09/2026).
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql            # datos persistentes (volumen de Docker, no carpeta local)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend                      # node:24-slim + OpenSSL (lo necesita Prisma), ver backend/Dockerfile
    user: node                            # evita que los archivos generados queden como root
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      # La CLI de Prisma (migrate, studio) usa la URL.
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      # La app se conecta con el adaptador de Prisma para MySQL, que no acepta URLs mysql://.
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE}
      PORT: 3000
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      CUSTOMERS_JSON: ${CUSTOMERS_JSON:-[]}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy        # espera a que MySQL acepte conexiones

  frontend:
    image: node:24-slim
    user: node
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  db_data:
