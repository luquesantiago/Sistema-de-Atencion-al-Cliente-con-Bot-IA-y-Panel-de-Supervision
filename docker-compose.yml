name: seguros-castano

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Sin TZ a propósito: MySQL corre en UTC, igual que las fechas que escribe
      # Prisma. La hora argentina se usa solo para mostrar (decisión 21/09/2026).
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql            # datos persistentes (volumen de Docker, no carpeta local)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend                      # node:24-slim + OpenSSL (lo necesita Prisma), ver backend/Dockerfile
    user: node                            # evita que los archivos generados queden como root
    working_dir: /app
    # Aplica las migraciones pendientes antes de arrancar. Si una falla, el
    # backend no arranca y el error queda en los logs.
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"
    environment:
      # La CLI de Prisma (migrate, studio) usa la URL.
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      # La app se conecta con el adaptador de Prisma para MySQL, que no acepta URLs mysql://.
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE}
      PORT: 3000
      AI_API_URL: ${AI_API_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy        # espera a que MySQL acepte conexiones

  frontend:
    image: node:24-slim
    user: node
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  # Puente con WhatsApp (WAHA, motor GOWS, sin navegador). No es la API oficial:
  # usa un WhatsApp personal vinculado con QR y le contesta a cualquiera que le
  # escriba, así que solo arranca con el perfil y sin restart (ver README).
  waha:
    image: devlikeapro/waha:gows-2026.9.2
    profiles: [whatsapp]
    user: "1000:1000"                     # la sesión queda del usuario de WSL, no de root
    ports:
      - "127.0.0.1:8080:3000"             # dashboard solo local; el 3000 del host es del backend
    volumes:
      - ${HOME}/waha-sesion:/app/.sessions  # sesión vinculada: fuera del repo, crearla antes del primer up
    environment:                          # sin env_file: WAHA lee varias variables WHATSAPP_* del backend
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_START_SESSION: seguros-castano   # la crea si no existe; el backend usa el mismo nombre
      WAHA_API_KEY: ${WHATSAPP_API_KEY}   # misma clave que usa el backend para llamar a WAHA
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_HOOK_URL: http://backend:3000/webhooks/whatsapp
      WHATSAPP_HOOK_EVENTS: message       # solo los mensajes entrantes
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-Webhook-Secret:${WHATSAPP_WEBHOOK_SECRET}
      WAHA_SESSION_CONFIG_IGNORE_STATUS: "true"
      WAHA_SESSION_CONFIG_IGNORE_GROUPS: "true"
      WAHA_SESSION_CONFIG_IGNORE_CHANNELS: "true"
      WAHA_SESSION_CONFIG_IGNORE_BROADCAST: "true"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "false"

volumes:
  db_data:
